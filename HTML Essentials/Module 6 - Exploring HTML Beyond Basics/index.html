<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discover Your World</title>
    <!-- Task 1: Add the favicon link here -->
     <link rel="icon" href="https://edube.org/uploads/media/default/0001/04/web-favicon.png" type="image/x-icon">
    <!-- Task 2: Add link to script here -->
     <script src="script.js"></script>
</head>
<body>
    <h1>Discover Your World <!-- Task 3: Add an emoji here --> &#x1F30D;&#x1F493;</h1>
    <p>Click the button to learn about the continent you're on and some famous geographical features.</p>
    <!-- Task 4: Add a button for displaying geolocation information here -->
    <button id="discoverLocation">Discover Location</button>
    <img src="https://edube.org/uploads/media/default/0001/04/continents.jpg" usemap="#image-map" alt="World Map">
    <map name="image-map">
        <!-- Task 5: Add area tags for continents here -->
         <area alt="North America" title="North America" id="north-america" shapge="rect" coords="386,283,41,17">
         <area alt="South America" title="South America" id="south-america" shape="rect" coords="209,501,358,288"> 
         <area alt="Europe" title="Europe" id="europe" shape="rect" coords="391,68,505,217">
         <area alt="Africa" title="Africa" id="africa" shape="rect" coords="533,217,387,448">
         <area alt="Asia" title="Asia" id="asia" shape="rect" coords="893,153,506,1">
         <area alt="Australia and Oceania" title="Australia and Oceania" id="australia-and-oceania" shape="rect" coords="679,353,872,480">
    </map>
</body>
</html>
